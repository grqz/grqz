name: Build NeonDL

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build helper
        run: |
          cmake -S host -B host/build -A x64
          cmake --build host/build --config Release

      - name: Test
        run: ctest --test-dir host/build -C Release --output-on-failure

      - name: Package
        run: |
          New-Item -ItemType Directory NeonDL | Out-Null
          Copy-Item host/build/Release/neondl-host.exe NeonDL/
          Copy-Item -Recurse extension NeonDL/extension
          Copy-Item installer/* NeonDL/
          Compress-Archive -Path NeonDL/* -DestinationPath NeonDL-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NeonDL-windows
          path: NeonDL-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NeonDL-windows.zip
            host/build/Release/neondl-host.exe
